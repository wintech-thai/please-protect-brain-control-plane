---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pp-cr-{{ .Values.envAlias }}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec"]
  verbs: ["get", "create", "list"]
  
- apiGroups: ["batch"]
  resources: ["cronjobs", "jobs"]
  verbs: ["get", "create", "list", "patch"]

# -----------------------
# ADD: workload readonly
# -----------------------
- apiGroups: ["apps"]
  resources:
    - deployments
    - statefulsets
    - daemonsets
    - replicasets
  verbs: ["get", "list", "watch"]

# -----------------------
# ADD: pod status + events
# -----------------------
- apiGroups: [""]
  resources:
    - pods
    - events
  verbs: ["get", "list", "watch", "delete"]

# -----------------------
# ADD: metrics (cpu/memory)
# ต้องมี metrics-server
# -----------------------
- apiGroups: ["metrics.k8s.io"]
  resources:
    - pods
  verbs: ["get", "list"]

# -----------------------
# ADD: list namespaces
# -----------------------
- apiGroups: [""]
  resources:
    - namespaces
  verbs: ["get", "list"]
