apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: idp-secret
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: k8s-secret-store      # name of the SecretStore (or kind specified)
  target:
    name: idp-secret  # name of the k8s Secret to be created
  data:
  - secretKey: INITIAL_USER
    remoteRef:
      key: initial-secret
      property: INITIAL_USER

  - secretKey: KEYCLOAK_USER
    remoteRef:
      key: initial-secret
      property: KEYCLOAK_USER

  - secretKey: KEYCLOAK_PASSWORD
    remoteRef:
      key: initial-secret
      property: KEYCLOAK_PASSWORD

  {{- if eq .Values.envGroup "dev" }}
  - secretKey: IDP_CLIENT_ID
    remoteRef:
      key: initial-secret
      property: IDP_CLIENT_ID_DEV

  - secretKey: IDP_CLIENT_SECRET
    remoteRef:
      key: initial-secret
      property: IDP_CLIENT_SECRET_DEV

  - secretKey: IDP_URL_PREFIX
    remoteRef:
      key: initial-secret
      property: IDP_URL_PREFIX_DEV

  - secretKey: IDP_REALM
    remoteRef:
      key: initial-secret
      property: IDP_REALM_DEV
  {{- else if eq .Values.envGroup "prod" }}
  - secretKey: IDP_CLIENT_ID
    remoteRef:
      key: initial-secret
      property: IDP_CLIENT_ID_PROD

  - secretKey: IDP_CLIENT_SECRET
    remoteRef:
      key: initial-secret
      property: IDP_CLIENT_SECRET_PROD

  - secretKey: IDP_URL_PREFIX
    remoteRef:
      key: initial-secret
      property: IDP_URL_PREFIX_PROD

  - secretKey: IDP_REALM
    remoteRef:
      key: initial-secret
      property: IDP_REALM_PROD
  {{- end }}
